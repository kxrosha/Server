[mypy]
# Версия Python
python_version = 3.13

# Основные настройки строгости
warn_return_any = True
warn_unused_configs = True
check_untyped_defs = False
disallow_untyped_decorators = True
no_implicit_optional = True

# Строгая типизация для FastAPI проекта
disallow_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True

# Отображение ошибок
show_error_codes = True
show_column_numbers = True

# Кеш для ускорения проверок
cache_dir = ".mypy_cache"

# Архитектура проекта — строгие настройки
[mypy-app.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-backend.app.*]
disallow_untyped_defs = True

[mypy-backend.services.*]
disallow_untyped_defs = True

[mypy-backend.configs.*]
disallow_untyped_defs = True

# Тесты — менее строгие требования
[mypy-backend.tests.*]
disallow_untyped_defs = False

# Миграции Alembic — полное игнорирование
[mypy-backend.migrations.*]
ignore_errors = True

[mypy-alembic.*]
ignore_errors = True

# Telegram бот — базовая типизация
[mypy-telegram_bot.*]
disallow_untyped_defs = False

# Скрипты запуска — минимальные требования
[mypy-scripts.*]
disallow_untyped_defs = False

# Библиотеки — игнорирование отсутствующих типов
[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True
[mypy-sqlalchemy.orm.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True
[mypy-pydantic_settings.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True
[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True
[mypy-mcrcon.*]
ignore_missing_imports = True

[mypy-pyTelegramBotAPI.*]
ignore_missing_imports = True
[mypy-telebot.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True
[mypy-httpx.*]
ignore_missing_imports = True

# Тестовые библиотеки
[mypy-pytest.*]
ignore_missing_imports = True
[mypy-pytest_mock.*]
ignore_missing_imports = True
[mypy-freezegun.*]
ignore_missing_imports = True

[mypy-ruff.*]
ignore_missing_imports = True

# Служебные файлы — минимальные требования
[mypy-run.*]
disallow_untyped_defs = False

[mypy-frontend.*]
ignore_errors = True
