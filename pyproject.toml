[project]
name = "minecraft-server-api"
version = "0.1.0"
description = "FastAPI API для Minecraft сервера"
readme = "README.md"
requires-python = "==3.13.0"

dependencies = [
    "alembic>=1.13.2",                           # Миграции
    "fastapi>=0.115.0",                          # API
    "mcrcon>=0.0.6",                             # Minecraft RCON
    "psycopg2-binary>=2.9.9",                    # PostgreSQL
    "python-dotenv>=1.0.1",                      # .env
    "python-jose[cryptography]>=3.3.0",          # JWT
    "redis>=5.0.8",                              # Кеш
    "sqlalchemy>=2.0.36",                        # ORM
    "uvicorn[standard]>=0.30.6",                 # Сервер
    "pydantic-settings>=2.5.2",                  # Конфиги
    "types-python-jose>=3.5.0.20250531",
    "types-passlib>=1.7.7.20250602",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "httpx>=0.27.2",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]
